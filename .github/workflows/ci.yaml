name: Elixir CI

on:
  push:
    branches:
      - main
      - hotfix/[0-9]+.[0-9]+.[0-9]+
      - release/[0-9]+.[0-9]+.[0-9]+
    tags:
      - "*"
  pull_request:
    types: [synchronize, opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  COVERAGE_TARGET: "80"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.elixir }}-erlang-${{ matrix.erlang }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20.2"
            erlang: "29.0.4"
            latest: false
            warnings_as_errors: false
          - elixir: "1.19.3"
            erlang: "28.1.1"
            latest: true
            warnings_as_errors: true
          - elixir: "1.18.4"
            erlang: "27.3.4.2"
            latest: false
            warnings_as_errors: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.erlang }}

      - name: Restore deps/build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.erlang }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.erlang }}-

      - name: Restore Dialyzer PLT cache (latest only)
        if: matrix.latest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.erlang }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.erlang }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors
        if: matrix.warnings_as_errors

      - name: Compile (warnings allowed on this Elixir version pending cleanup)
        run: mix compile
        if: ${{ !matrix.warnings_as_errors }}

      - run: mix test
        if: ${{ !matrix.latest }}

      - name: Run tests with coverage (latest only)
        if: matrix.latest
        run: |
          set -o pipefail
          mix test --cover | tee coverage_output.txt

      # Parses the `xx.xx% | Total` line for the coverage_report job.
      # Not enforced -- mix.exs sets threshold: 0, so only a test failure fails this job.
      - name: Summarize coverage (latest only)
        if: always() && matrix.latest
        run: |
          pct=$(grep -E '[0-9]+(\.[0-9]+)?% \| Total\b' coverage_output.txt 2>/dev/null | tail -1 \
                | grep -oE '[0-9]+(\.[0-9]+)?' | head -1 || true)
          pct=${pct:-0}
          echo "${pct} ${COVERAGE_TARGET}" > coverage_summary.txt
          {
            echo "### Coverage"
            echo ""
            echo "Line coverage is **${pct}%** (target ${COVERAGE_TARGET}%)."
            awk -v p="$pct" -v t="$COVERAGE_TARGET" 'BEGIN {
              if (p + 0 < t + 0)
                print "\n:warning: Below target — consider adding tests to help meet the goal."
              else
                print "\n:white_check_mark: Meets target."
            }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary (latest only)
        if: always() && matrix.latest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage_summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Quality checks (latest only)
        if: matrix.latest
        run: |
          mix deps.unlock --check-unused
          mix format --check-formatted
          mix credo -a
          mix dialyzer

      - name: Docs + hex build (latest only)
        if: matrix.latest
        run: |
          mix deps.get
          mix docs --warnings-as-errors
          mix hex.build
        env:
          MIX_ENV: docs

  spelling_and_markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Install cspell and markdownlint-cli2
        run: npm i -g cspell markdownlint-cli2

      - name: Spell check
        run: cspell --quiet .

      - name: Lint markdown files
        run: markdownlint-cli2

  # Posts a sticky, non-blocking PR comment with the coverage % from the test job.
  coverage_report:
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-summary

      - name: Post coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- grizzly-coverage-report -->'

          if [ ! -f coverage_summary.txt ]; then
            echo "No coverage data found; skipping comment."
            exit 0
          fi
          read -r pct tgt < coverage_summary.txt

          status='✅'
          note="> ✅ Coverage meets the **${tgt}%** target. Nice work!"
          if awk -v p="$pct" -v t="$tgt" 'BEGIN { exit !(p + 0 < t + 0) }'; then
            status='⚠️ consider adding tests'
            note="> ⚠️ Coverage is below the **${tgt}%** target. Coverage is **not enforced** — this won't block the PR. Please consider adding tests to help meet the goal. 💚"
          fi

          {
            echo "## 🧪 Test coverage report"
            echo ""
            echo "| Coverage | Target | Status |"
            echo "|---:|---:|---|"
            echo "| ${pct}% | ${tgt}% | ${status} |"
            echo ""
            echo "$note"
            echo ""
            echo "<sub>Measured with \`mix test --cover\` on host. ${marker}</sub>"
          } > comment.md

          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
                     --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1 || true)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" \
              -f body="$(cat comment.md)" >/dev/null
            echo "Updated existing coverage comment (${existing})."
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="$(cat comment.md)" >/dev/null
            echo "Created coverage comment."
          fi
